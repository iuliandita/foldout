[package]
name = "libraryd"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = []
embedded-ui = []

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
argon2 = "=0.6.0"
getrandom = "=0.4.3"
sha2 = "=0.11.0"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "cookies", "query", "form", "multipart"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
bendy = "=0.6.1"
sha1 = "=0.11.0"
chacha20poly1305 = "=0.11.0"
libc = "=0.2.189"
scraper = "=0.27.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
