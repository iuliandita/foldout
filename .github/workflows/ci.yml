name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 2

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install reader tools
        # Distro 7-Zip builds omit RAR decoding; match the upstream static build the image ships.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils util-linux
          curl -fsSLo 7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz
          echo "dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695  7z.tar.xz" | sha256sum -c -
          tar -xJf 7z.tar.xz 7zzs
          sudo install -m 755 7zzs /usr/local/bin/7z
          rm 7z.tar.xz 7zzs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend tools and dependencies
        run: |
          bun install --cwd tools --frozen-lockfile
          ./scripts/bun install --cwd web --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch crates
        run: cargo fetch --locked

      - name: Run full gate
        run: ./scripts/check

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
