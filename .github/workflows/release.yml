name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without publishing
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DRY_RUN" != true ]]; then
            echo 'Manual runs must use dry_run' >&2
            exit 1
          fi
          python3 scripts/validate-release.py

  checks:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  dry-build:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, target: ''}
          - {arch: arm64, runner: ubuntu-24.04-arm, target: ''}
          - {arch: amd64, runner: ubuntu-24.04, target: debian}
          - {arch: arm64, runner: ubuntu-24.04-arm, target: debian}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_BUILD_JOBS=4
            LIBRARY_BUILD_COMMIT=${{ github.sha }}
          push: false

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, variant: alpine, target: ''}
          - {arch: arm64, runner: ubuntu-24.04-arm, variant: alpine, target: ''}
          - {arch: amd64, runner: ubuntu-24.04, variant: debian, target: debian}
          - {arch: arm64, runner: ubuntu-24.04-arm, variant: debian, target: debian}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_BUILD_JOBS=4
            LIBRARY_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create and sign manifests and export SBOMs
        env:
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p sboms
          for variant in alpine debian; do
            suffix=''
            [[ "$variant" == debian ]] && suffix=-debian
            sources=()
            for arch in amd64 arm64; do
              for digest in "digests/digest-${variant}-${arch}"/*; do
                sources+=("${IMAGE}@sha256:${digest##*/}")
              done
            done
            tags=(-t "${IMAGE}:${GITHUB_REF_NAME}${suffix}")
            if [[ "$PRERELEASE" == false && "$variant" == alpine ]]; then
              tags+=(-t "${IMAGE}:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            ref="${IMAGE}:${GITHUB_REF_NAME}${suffix}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest)
            if cosign sign --yes "${IMAGE}@${digest}" 2>sign-error; then
              cat sign-error
            else
              cat sign-error >&2
              if grep -q '409' sign-error && grep -qi 'an equivalent entry already exists' sign-error; then
                cosign verify "${IMAGE}@${digest}" \
                  --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com
              else
                exit 1
              fi
            fi
            for arch in amd64 arm64; do
              docker buildx imagetools inspect "${IMAGE}@${digest}" \
                --format "{{ json (index .SBOM \"linux/${arch}\").SPDX }}" \
                | jq -e 'select(.SPDXID == "SPDXRef-DOCUMENT")' > "sboms/${variant}-${arch}.spdx.json"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sboms
          path: sboms/*.spdx.json
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sboms
          path: sboms
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${args[@]}" sboms/*.spdx.json
