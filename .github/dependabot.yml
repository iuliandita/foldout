version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /tools
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
