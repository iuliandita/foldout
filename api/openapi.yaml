    "title": "Library API",
    "version": "0.1.0",
    "description": "Catalog and administrator API. Cookie-authenticated writes require an Origin matching LIBRARY_ORIGIN. Use scoped Bearer API keys for automation. Browser sessions are stored in HttpOnly cookies; login responses contain no secret. Nullable PATCH fields distinguish omission from explicit null."
  },
