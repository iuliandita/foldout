    "/api/v1/publications": {
      "get": {
        "operationId": "listPublications",
        "responses": {
          "200": {
            "description": "Successful operation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublicationPage"
                }
              }
            }
          },
          "default": {
            "description": "Operation failed; response includes a safe reason and trace ID",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Opaque cursor from next_cursor. It encodes the sort key and filters; reuse it only with the same sort, kind, q, and availability, otherwise the request fails with 400."
          },
          {
            "name": "kind",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "comic",
                "manga",
                "magazine"
              ]
            }
          },
          {
            "name": "q",
            "in": "query",
            "description": "Literal substring in title or run label. Trimmed; ASCII case-insensitive, non-ASCII case-sensitive. Maximum 256 UTF-8 bytes before trimming, no control characters. Empty is unfiltered. Cursor must match the normalized query.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "description": "title (default): ascending sort title, then id. recently_added: newest first by creation time, ties broken by descending id. Publications created before creation times were recorded sort as oldest.",
            "schema": {
              "type": "string",
              "enum": [
                "title",
                "recently_added"
              ],
              "default": "title"
            }
          },
          {
            "name": "availability",
            "in": "query",
            "description": "all (default), has_files (at least one library file covers a unit), or no_files. Matches file_count > 0 or = 0.",
            "schema": {
              "type": "string",
              "enum": [
                "all",
                "has_files",
                "no_files"
              ],
              "default": "all"
            }
          }
        ],
        "description": "Publications with availability summaries. monitored_unit_count is scoped to the caller."
      },
      "post": {
        "operationId": "createPublication",
        "responses": {
          "201": {
            "description": "Successful operation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Publication"
                }
              }
            }
          },
          "default": {
            "description": "Operation failed; response includes a safe reason and trace ID",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NewPublication"
              }
            }
          }
        }
      }
    },
