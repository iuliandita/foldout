    "/api/v1/wanted": {
      "get": {
        "operationId": "listWanted",
        "description": "Requires read scope. Lists explicitly cataloged units only; known_unit_count never creates inferred rows. Availability derives from persisted coverage and scan state, without filesystem access. Monitor counts are scoped to the caller. publication_totals aggregates the matching units of each publication on the page, independent of pagination.",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "description": "Opaque cursor bound to the caller and normalized filters.",
            "schema": {
              "type": "string",
              "maxLength": 8192
            }
          },
          {
            "name": "q",
            "in": "query",
            "description": "Literal substring in publication title, run label, or unit label. ASCII case-insensitive; maximum 256 UTF-8 bytes and no control characters.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "kind",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "comic",
                "manga",
                "magazine"
              ]
            }
          },
          {
            "name": "publication_id",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "monitoring",
            "in": "query",
            "description": "monitored requires at least one enabled, non-deleted monitor owned by the caller. unmonitored means none are enabled, including units with only paused monitors.",
            "schema": {
              "type": "string",
              "enum": [
                "all",
                "monitored",
                "unmonitored"
              ],
              "default": "all"
            }
          },
          {
            "name": "availability",
            "in": "query",
            "description": "attention includes units with no association or any missing, changed, scan-error, or scan-unavailable file, even when another file is present. unverified has associations but no present or fault status, including unmanaged or unobserved paths.",
            "schema": {
              "type": "string",
              "enum": [
                "attention",
                "unverified",
                "all"
              ],
              "default": "attention"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful operation",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WantedPage"
                }
              }
            }
          },
          "default": {
            "description": "Operation failed; response includes a safe reason and trace ID",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
