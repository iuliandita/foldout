      "WantedPublicationTotals": {
        "type": "object",
        "description": "Per-publication unit counts using the same classification as WantedUnit. missing, unverified, and present are disjoint; changed, scan_problem, and monitored can overlap with them.",
        "properties": {
          "publication_id": {
            "type": "string",
            "format": "uuid"
          },
          "total": {
            "type": "integer",
            "minimum": 0,
            "description": "Matching units."
          },
          "missing": {
            "type": "integer",
            "minimum": 0,
            "description": "Units with no association, or whose associated files are all missing."
          },
          "unverified": {
            "type": "integer",
            "minimum": 0,
            "description": "Units with at least one linked file whose availability is unverified. Never overlaps with missing."
          },
          "present": {
            "type": "integer",
            "minimum": 0,
            "description": "Units whose availability is confirmed_present."
          },
          "changed": {
            "type": "integer",
            "minimum": 0,
            "description": "Units with at least one changed file."
          },
          "scan_problem": {
            "type": "integer",
            "minimum": 0,
            "description": "Units with at least one scan_error or scan_unavailable file."
          },
          "monitored": {
            "type": "integer",
            "minimum": 0,
            "description": "Units with at least one enabled, non-deleted monitor owned by the caller."
          }
        },
        "required": [
          "publication_id",
          "total",
          "missing",
          "unverified",
          "present",
          "changed",
          "scan_problem",
          "monitored"
        ],
        "additionalProperties": false
